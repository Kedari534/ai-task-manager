## ===============================
## DATABASE CONFIGURATION (Localhost MySQL)
## ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/ai_task_manager?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

## ===============================
## JWT CONFIGURATION
## ===============================
aitask.app.jwtSecret=TaskFlowAIPremiumSecretKeyForJWTGenerationMustBeLongEnough
aitask.app.jwtExpirationMs=86400000

## ===============================
## GROQ AI CONFIGURATION
## ===============================
aitask.gemini.api-key=<YOUR_GEMINI_API_KEY>
aitask.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

## ===============================
## SERVER CONFIGURATION
## ===============================
server.port=8081